  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Segoe Script','Bradley Hand',cursive;
  --r:20px; --r2:14px; --bd:2.5px solid var(--ink); --sh:0 5px 0 var(--ink); --sh-s:0 3px 0 var(--ink);
  --gut:16px; --weave:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 12% 8%,var(--t3) 0,transparent 32%),radial-gradient(circle at 92% 22%,var(--t5) 0,transparent 30%),radial-gradient(circle at 70% 96%,var(--t1) 0,transparent 34%);
  background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:-.015em;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.ico{width:1.25em;height:1.25em;flex:none;vertical-align:-.2em}
.ico.fill{fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--s3);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}

/* ---------- estructura ---------- */
#app{min-height:100vh}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:var(--gut)}
main.wrap{padding-block:18px 130px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:var(--bd)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.15rem var(--f-display);text-decoration:none;border:0;background:none;padding:0;text-align:left;line-height:1.05}
.brand .mark{width:38px;height:38px;border-radius:50%;background:var(--s1);border:var(--bd);display:grid;place-items:center;color:var(--ink);box-shadow:var(--sh-s);transform:rotate(-8deg);flex:none}
.brand small{display:block;font:700 .66rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.nav{display:none;gap:6px;margin-left:auto}
.nav button{border:2px solid transparent;background:none;padding:8px 14px;border-radius:999px;font:700 .95rem var(--f-display);display:flex;gap:8px;align-items:center}
.nav button[aria-current=page]{background:var(--s3);border-color:var(--ink);box-shadow:var(--sh-s)}
.nav button:hover{background:var(--t3)}
.top .cta{display:none;margin-left:6px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end}
.tabbar button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 2px;font:700 .7rem var(--f-body);color:var(--muted);min-height:52px}
.tabbar button .ico{width:24px;height:24px}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar button[aria-current=page] .ico{background:var(--s3);border:2px solid var(--ink);border-radius:10px;padding:2px;width:30px;height:30px}
.tabbar .fab{width:62px;height:62px;border-radius:50%;background:var(--s1);border:var(--bd);box-shadow:var(--sh);margin:-30px auto 2px;display:grid;place-items:center;color:var(--ink);padding:0;min-height:0}
.tabbar .fab .ico{width:30px;height:30px}
.tabbar .fab:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
@media(min-width:900px){.nav{display:flex}.tabbar{display:none}main.wrap{padding-bottom:70px}.top .cta{display:inline-flex}}
@media(max-width:899px){.top .wrap{justify-content:center}}

/* ---------- piezas ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--bd);background:var(--paper);color:var(--ink);padding:11px 18px;border-radius:999px;font:800 .98rem var(--f-display);box-shadow:var(--sh-s);text-decoration:none;line-height:1.1;transition:transform .12s,box-shadow .12s;min-height:46px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.p1{background:var(--s1)}.btn.p2{background:var(--s2)}.btn.p3{background:var(--s3)}.btn.p4{background:var(--s4);color:#fff}.btn.p5{background:var(--s5)}.btn.p6{background:var(--s6)}
.btn.ghost{border-color:transparent;box-shadow:none;background:none}
.btn.ghost:hover{background:var(--t3);box-shadow:none;transform:none}
.btn.sm{padding:7px 13px;font-size:.88rem;min-height:38px}
.btn.lg{padding:15px 26px;font-size:1.1rem;min-height:56px}
.btn.icon{padding:0;width:46px;height:46px}
.btn.sm.icon{width:38px;height:38px}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--paper);padding:6px 12px;border-radius:999px;font:700 .86rem var(--f-body);line-height:1.1;min-height:36px;white-space:nowrap}
button.chip:hover{background:var(--t3)}
.chip[aria-pressed=true],.chip.on{background:var(--s3);box-shadow:var(--sh-s)}
.chip.t1{background:var(--t1)}.chip.t2{background:var(--t2)}.chip.t3{background:var(--t3)}.chip.t4{background:var(--t4)}.chip.t5{background:var(--t5)}.chip.t6{background:var(--t6)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--paper);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card.flat{box-shadow:none}
.lbl{font:800 .72rem var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.h-sec{font-size:clamp(1.55rem,4.4vw,2.3rem);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec{margin-top:34px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hand{font-family:var(--f-hand);font-weight:600;font-size:1.45rem;line-height:1.15}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.weave{height:20px;background:var(--weave) repeat-x center/auto 100%;border-block:var(--bd)}
.hearts{display:inline-flex;gap:2px;color:var(--s1);vertical-align:middle}
.hearts .ico{width:1.05em;height:1.05em}
.hearts .off{color:#C9C3E6}
.hbtn{background:none;border:0;padding:3px;color:var(--s1);line-height:0;border-radius:8px}
.hbtn .ico{width:28px;height:28px}
.hbtn.off{color:#CFC9EA}
.hbtn:hover{transform:scale(1.12)}
.stk{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);padding:5px 11px;border-radius:10px;font:800 .78rem var(--f-display);letter-spacing:.04em;text-transform:uppercase;transform:rotate(-2.5deg);box-shadow:var(--sh-s);background:var(--t1)}
.stk .ico{width:1.1em;height:1.1em}
.empty{text-align:center;padding:30px 18px;display:grid;gap:12px;justify-items:center}
.skel{background:linear-gradient(90deg,var(--soft),#fff,var(--soft));background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- portada ---------- */
.hero{position:relative;overflow:hidden;border:var(--bd);border-radius:28px;box-shadow:0 7px 0 var(--ink);color:#fff;background:linear-gradient(135deg,var(--s1) 0%,var(--s4) 58%,var(--s5) 100%);padding:clamp(22px,5vw,46px) clamp(18px,4vw,40px) 0}
.hero h1{font-size:clamp(2.5rem,9vw,5.4rem);line-height:.96;color:#fff;text-shadow:0 3px 0 rgba(30,26,77,.55)}
.hero h1 .amp{font-family:var(--f-hand);font-style:normal;font-weight:700;color:var(--s3);padding:0 .06em}
.hero .kick{display:inline-flex;gap:8px;align-items:center;background:var(--s3);color:var(--ink);border:2px solid var(--ink);padding:5px 13px;border-radius:999px;font:800 .8rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;transform:rotate(-2deg);box-shadow:var(--sh-s)}
.hero .sub{max-width:34ch;margin-top:14px;font:600 1.12rem/1.35 var(--f-body);text-shadow:0 1px 0 rgba(30,26,77,.4)}
.hero .days{display:inline-grid;margin-top:20px;background:var(--paper);color:var(--ink);border:var(--bd);border-radius:20px;padding:10px 18px;box-shadow:var(--sh);transform:rotate(1.5deg);text-shadow:none}
.hero .days b{font:800 2.2rem var(--f-display);line-height:1}
.hero .days span{font:700 .78rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.hero .deco{position:absolute;pointer-events:none}
.hero .weave{margin:34px calc(-1 * clamp(18px,4vw,40px)) 0;border-bottom:0;height:26px}
.hero .row{position:relative;z-index:1;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:22px}
.stat{background:var(--paper);border:var(--bd);border-radius:var(--r2);padding:12px 14px;box-shadow:var(--sh-s)}
.stat b{display:block;font:800 1.8rem var(--f-display);line-height:1}
.stat span{font:700 .74rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.stat:nth-child(1){background:var(--t1)}.stat:nth-child(2){background:var(--t2)}.stat:nth-child(3){background:var(--t3)}.stat:nth-child(4){background:var(--t4)}.stat:nth-child(5){background:var(--t5)}

/* ---------- tarjetas de aventura ---------- */
.acard{position:relative;display:flex;flex-direction:column;border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);background:var(--paper);overflow:hidden;text-align:left;padding:0;transition:transform .15s,box-shadow .15s;color:var(--ink);text-decoration:none}
a.acard:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 8px 0 var(--ink)}
.acard .ph{position:relative;aspect-ratio:4/3;background:var(--tc,var(--t1));border-bottom:var(--bd);overflow:hidden}
.acard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.acard .ph .big{position:absolute;inset:0;display:grid;place-items:center;color:var(--sc,var(--s1))}
.acard .ph .big .ico{width:34%;height:34%;opacity:.9}
.acard .ph .stk{position:absolute;left:10px;top:10px;background:var(--tc,var(--t1))}
.acard .ph .ret{position:absolute;right:10px;top:10px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 9px;font:800 .78rem var(--f-display);display:flex;gap:5px;align-items:center;box-shadow:var(--sh-s)}
.acard .ph .ret .ico{color:var(--s1)}
.acard .bd{padding:14px 16px 16px;display:grid;gap:6px}
.acard h3{font-size:1.3rem}
.acard .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font:700 .82rem var(--f-body);color:var(--ink2)}
.acard .meta span{display:inline-flex;align-items:center;gap:5px}
.tools{display:grid;gap:12px}
.tools .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;position:relative}
.search input{padding-left:42px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.tl{position:relative;display:grid;gap:18px;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:4px;background:repeating-linear-gradient(var(--ink) 0 8px,transparent 8px 14px);border-radius:4px}
.tl .mo{font:800 1.3rem var(--f-display);position:relative}
.tl .mo::before{content:"";position:absolute;left:-26px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--s3);border:var(--bd)}

/* ---------- formularios ---------- */
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font:800 .86rem var(--f-display)}
.field small{color:var(--muted);font-weight:600}
input[type=text],input[type=tel],input[type=url],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;border:2px solid var(--ink);border-radius:var(--r2);background:#fff;padding:11px 13px;min-height:46px;box-shadow:inset 0 2px 0 rgba(30,26,77,.06)}
textarea{min-height:92px;resize:vertical;line-height:1.45}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--s3);outline-offset:1px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.acc{border:var(--bd);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh-s);overflow:hidden}
.acc+.acc{margin-top:14px}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font:800 1.1rem var(--f-display);background:var(--t3)}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .n{width:34px;height:34px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:grid;place-items:center;font-size:.95rem;flex:none}
.acc>summary .chev{margin-left:auto;transition:transform .2s}
.acc[open]>summary .chev{transform:rotate(180deg)}
.acc>div.in{padding:16px;display:grid;gap:14px;border-top:var(--bd)}
.edit-grid{display:grid;gap:22px}
@media(min-width:980px){.edit-grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.edit-side{position:sticky;top:84px}}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.ph-item{position:relative;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--soft);display:grid}
.ph-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph-item input{border-radius:0;border:0;border-top:2px solid var(--ink);min-height:36px;padding:6px 8px;font-size:.84rem;box-shadow:none}
.ph-item .x{position:absolute;right:6px;top:6px}
.ph-item .cv{position:absolute;left:6px;top:6px}
.ph-item.up{place-items:center;aspect-ratio:1;color:var(--ink2);font-weight:800;text-align:center;padding:10px;font-size:.8rem}
.addbox{border:2.5px dashed var(--ink);border-radius:16px;background:var(--t5);display:grid;place-items:center;align-content:center;gap:6px;padding:14px;text-align:center;font:800 1rem var(--f-display);cursor:pointer}
.dish{display:grid;gap:10px;border:2px solid var(--ink);border-radius:16px;padding:12px;background:var(--soft)}
.dish .r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.who{display:inline-flex;align-items:center;gap:6px;font:800 .8rem var(--f-display)}
.who i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:.72rem;background:var(--who-a);color:var(--ink)}
.who.b i{background:var(--who-b)}
.seg{display:inline-flex;border:var(--bd);border-radius:999px;overflow:hidden;background:var(--paper);box-shadow:var(--sh-s)}
.seg button{border:0;background:none;padding:9px 16px;font:800 .92rem var(--f-display);display:flex;gap:7px;align-items:center}
.seg button[aria-pressed=true]{background:var(--s3)}
.seg button+button{border-left:2px solid var(--ink)}
.moods{display:flex;flex-wrap:wrap;gap:8px}
.moods button{font-size:1.6rem;line-height:1;width:50px;height:50px;border-radius:14px;border:2px solid var(--ink);background:#fff}
.moods button[aria-pressed=true]{background:var(--s3);box-shadow:var(--sh-s);transform:rotate(-4deg)}
.ratings{display:grid;gap:8px}
.ratings .rw{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:2px dotted #CFC9EA}
.ratings .rw>span:first-child{font:700 .95rem var(--f-body);display:flex;gap:8px;align-items:center}
.prog{height:16px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--s1),var(--s3),var(--s2));width:0;transition:width .4s}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:var(--bd);padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.savebar .in{width:100%;max-width:1120px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}

/* ---------- modo lectura ---------- */
.reader{position:fixed;inset:0;z-index:60;background:#14102E;color:#fff;display:flex;flex-direction:column}
.reader .bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(20,16,46,.86);backdrop-filter:blur(8px);z-index:3}
.reader .bar .ttl{font:800 1rem var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;overflow-x:hidden;position:relative;padding:22px max(18px,env(safe-area-inset-left,0px)) 110px;display:flex;flex-direction:column;align-items:center}
.pg>.in{width:100%;max-width:880px;display:grid;gap:20px}
.pg h2{font-size:clamp(2rem,6vw,3.4rem);color:#fff}
.pg .lbl{color:var(--s3)}
.pg .fact .lbl,.pg .voice .lbl,.pg .dishc .lbl,.pg .card .lbl,.pg .ticket .lbl{color:var(--ink2)}
.pg.cover{padding:0;justify-content:flex-end;background:#14102E}
.pg.cover .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.9}
.pg.cover .bg.pat{opacity:1}
.pg.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,46,.15) 0%,rgba(20,16,46,.25) 35%,rgba(20,16,46,.92) 100%)}
.pg.cover .in{position:relative;z-index:2;padding:0 22px 120px;max-width:900px}
.pg.cover h1{font-size:clamp(2.6rem,10vw,6rem);line-height:.95;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.pg.cover .meta{display:flex;flex-wrap:wrap;gap:8px}
.pg.cover .meta .chip{background:#fff;color:var(--ink)}
.nav-arrows{position:absolute;inset:auto 0 0 0;z-index:4;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(20,16,46,.95),rgba(20,16,46,0))}
.dots{display:flex;gap:7px;align-items:center}
.dots button{width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:none;padding:0}
.dots button[aria-current=true]{background:var(--s3);border-color:var(--s3);transform:scale(1.35)}
.ticket{position:relative;background:#fff;color:var(--ink);border-radius:20px;padding:20px 22px;display:grid;gap:12px;border:var(--bd);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#14102E;transform:translateY(-50%)}
.ticket::before{left:-14px}.ticket::after{right:-14px}
.ticket .row{display:flex;gap:12px;align-items:flex-start}
.ticket .row .ico{margin-top:3px;color:var(--s1)}
.ticket a{font-weight:800}
.ticket .sp{border-top:3px dashed #CFC9EA;margin:2px 4px}
.big-n{font:800 2.4rem var(--f-display);line-height:1}
.fact{display:grid;gap:2px;background:var(--t3);color:var(--ink);border:var(--bd);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-s)}
.fact:nth-child(2){background:var(--t2)}.fact:nth-child(3){background:var(--t4)}.fact:nth-child(4){background:var(--t5)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.dishc{background:#fff;color:var(--ink);border:var(--bd);border-radius:18px;padding:14px;display:grid;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.dishc h3{font-size:1.15rem}
.voice{background:#fff;color:var(--ink);border:var(--bd);border-radius:22px;padding:18px;display:grid;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.4);align-content:start}
.voice .av{width:54px;height:54px;border-radius:50%;border:var(--bd);display:grid;place-items:center;font:800 1.5rem var(--f-display);background:var(--who-a);color:var(--ink)}
.voice.b .av{background:var(--who-b)}
.voice .quote{font-family:var(--f-hand);font-size:1.55rem;line-height:1.1;color:var(--ink)}
.two{display:grid;gap:18px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.note{position:relative;background:#FFF8D6;color:var(--ink);padding:16px 16px 18px;border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.35);font-family:var(--f-hand);font-size:1.5rem;line-height:1.1;transform:rotate(var(--rot,-1.5deg))}
.note small{display:block;font:800 .68rem var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.note::before{content:"";position:absolute;left:50%;top:-12px;width:78px;height:24px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,46,136,.55)}
.note:nth-child(2n){background:#D8F7F0;--rot:1.8deg}.note:nth-child(3n){background:#FFE0EE;--rot:-2.4deg}.note:nth-child(5n){background:#E8E0FF}
.polas{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding:10px 0}
.pola{display:block;background:#fff;padding:10px 10px 12px;border-radius:4px;box-shadow:0 8px 0 rgba(0,0,0,.35);width:min(100%,300px);transform:rotate(var(--rot,-2deg));position:relative;border:0;color:var(--ink);text-decoration:none}
.polas .pola:nth-child(2n){--rot:2.2deg}.polas .pola:nth-child(3n){--rot:-1deg}
.pola img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--soft)}
.pola .cap{font-family:var(--f-hand);font-size:1.35rem;line-height:1.05;text-align:center;margin-top:8px;min-height:1.2em;font-weight:600}
.pola::before{content:"";position:absolute;left:50%;top:-11px;width:70px;height:22px;transform:translateX(-50%) rotate(2deg);background:rgba(255,192,45,.75)}
.verdict{display:grid;gap:18px;justify-items:center;text-align:center}
.vbig{border:var(--bd);border-radius:26px;background:var(--s3);color:var(--ink);padding:22px 26px;box-shadow:0 8px 0 rgba(0,0,0,.4);display:grid;gap:6px;transform:rotate(-1.2deg);max-width:560px}
.vbig b{font:800 clamp(1.8rem,6vw,2.8rem) var(--f-display);line-height:1}
.radar{width:min(100%,380px);height:auto}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(10,8,28,.96);display:grid;grid-template-rows:auto 1fr auto;color:#fff}
.lightbox .stage{display:grid;place-items:center;padding:8px;min-height:0}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lightbox .cap{padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font:600 1.6rem var(--f-hand)}
.show{position:fixed;inset:0;z-index:85;background:#000;color:#fff;overflow:hidden}
.show .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
.show .sl.on{opacity:1}
.show .sl img{width:100%;height:100%;object-fit:cover;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.show .sl .q{position:absolute;left:0;right:0;bottom:0;padding:90px 22px calc(70px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);text-align:center;font:600 clamp(1.5rem,5vw,2.6rem)/1.1 var(--f-hand)}
.show .sl.txt{display:grid;place-items:center;background:linear-gradient(135deg,var(--s1),var(--s4),var(--s5));padding:30px;text-align:center}
.show .sl.txt .q{position:static;background:none;padding:0;font-size:clamp(1.8rem,6vw,3.2rem)}
.show .ctl{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;justify-content:flex-end;padding:calc(12px + env(safe-area-inset-top,0px)) 14px;z-index:3}
.show .pbar{position:absolute;left:0;bottom:0;height:6px;background:var(--s3);width:0;z-index:3}
canvas.conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* ---------- varios ---------- */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(20,16,46,.6);display:grid;place-items:center;padding:18px}
.modal{background:var(--paper);border:var(--bd);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:22px;max-width:480px;width:100%;display:grid;gap:14px;max-height:92vh;overflow:auto;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font:800 .95rem var(--f-display);box-shadow:0 5px 0 var(--s1);max-width:92vw;display:flex;gap:12px;align-items:center}
.toast button{background:var(--s3);color:var(--ink);border:0;border-radius:999px;padding:5px 12px;font:800 .85rem var(--f-display)}
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font:700 .88rem var(--f-body)}
.bars .b i{display:block;height:20px;border:2px solid var(--ink);border-radius:999px;background:var(--bc,var(--s1));min-width:6px}
.bars .b em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.podium{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.award{display:grid;gap:6px;border:var(--bd);border-radius:18px;padding:14px;background:var(--ac,var(--t3));box-shadow:var(--sh-s);text-decoration:none;color:var(--ink)}
.award .t{font:800 .72rem var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.award b{font:800 1.2rem var(--f-display)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{display:grid;gap:6px;justify-items:center;text-align:center;border:var(--bd);border-radius:18px;padding:14px 10px;background:var(--paper);box-shadow:var(--sh-s)}
.badge .ci{width:54px;height:54px;border-radius:50%;border:var(--bd);display:grid;place-items:center;background:var(--bc,var(--s3))}
.badge.lock{opacity:.5;filter:grayscale(1)}
.badge b{font:800 .95rem var(--f-display)}
.badge small{font-weight:600;color:var(--ink2);line-height:1.2}
.wheelbox{display:grid;gap:14px;justify-items:center}
.wheel{position:relative;width:min(100%,340px);aspect-ratio:1}
.wheel svg{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.68,.1,1)}
.wheel .pt{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--ink);filter:drop-shadow(0 2px 0 #fff);z-index:2}
.idea{display:grid;gap:8px;border:var(--bd);border-radius:18px;padding:14px;background:var(--paper);box-shadow:var(--sh-s);align-content:start}
.idea h3{font-size:1.1rem}
.rt{display:flex;gap:12px;align-items:center;border:var(--bd);border-radius:16px;padding:10px 12px;background:var(--paper);text-align:left;width:100%}
.rt .ck{width:30px;height:30px;border-radius:9px;border:2px solid var(--ink);display:grid;place-items:center;flex:none;background:#fff}
.rt.done{background:var(--t2)}
.rt.done .ck{background:var(--s2)}
.rt.done span:last-child{text-decoration:line-through;text-decoration-thickness:2px}
.banner{border:var(--bd);border-radius:16px;background:var(--t3);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ai-out{white-space:pre-wrap;font:600 1.05rem/1.55 var(--f-body)}
.steps{counter-reset:s;display:grid;gap:12px;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;position:relative;padding-left:46px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:34px;height:34px;border-radius:50%;border:var(--bd);background:var(--s3);display:grid;place-items:center;font:800 1rem var(--f-display)}
@media(max-width:560px){.bars .b{grid-template-columns:96px 1fr 58px}.hero h1{word-break:break-word}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function confetti() {

  const c = document.createElement('canvas'); c.className = 'conf'; document.body.appendChild(c);
  const W = c.width = innerWidth, H = c.height = innerHeight, x = c.getContext('2d'); const cols = palColors().concat(['#ffffff']);
  const ps = Array.from({ length: 90 }, () => ({ x: W / 2 + (Math.random() - .5) * 120, y: H * .62, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5, r: 4 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  const t0 = performance.now();

function radarSVG(id) {
  const cats = CATS.filter(c => ratingOf(id, 'a', c.id) || ratingOf(id, 'b', c.id));
  if (cats.length < 3) return '';
  const n = cats.length, cx = 150, cy = 150, R = 96;
  const pt = (i, v) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n, r = (R * v) / 5; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const ring = v => cats.map((c, i) => pt(i, v).map(x => x.toFixed(1)).join(',')).join(' ');
  const poly = w => cats.map((c, i) => pt(i, ratingOf(id, w, c.id)).map(x => x.toFixed(1)).join(',')).join(' ');
  const has = w => cats.some(c => ratingOf(id, w, c.id));
  const labels = cats.map((c, i) => { const [x, y] = pt(i, 6.15); const anchor = x < cx - 8 ? 'end' : x > cx + 8 ? 'start' : 'middle'; return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${anchor}" fill="#fff" font-size="12" font-weight="700" font-family="Nunito,sans-serif">${esc(c.short)}</text>`; }).join('');
  const axes = cats.map((c, i) => { const [x, y] = pt(i, 5); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.22)"/>`; }).join('');
  const fa = 'style="fill:var(--s2);stroke:var(--s2)"', fb = 'style="fill:var(--s1);stroke:var(--s1)"';
  return `<svg class="radar" viewBox="0 0 300 300" role="img" aria-label="Comparación de calificaciones">
    ${[1, 2, 3, 4, 5].map(v => `<polygon points="${ring(v)}" fill="none" stroke="rgba(255,255,255,${v === 5 ? .4 : .18})"/>`).join('')}${axes}
    ${has('a') ? `<polygon points="${poly('a')}" ${fa} fill-opacity=".38" stroke-width="3" stroke-linejoin="round"/>` : ''}
    ${has('b') ? `<polygon points="${poly('b')}" ${fb} fill-opacity=".38" stroke-width="3" stroke-linejoin="round"/>` : ''}${labels}</svg>`;
}
function agree(id) {
  const d = []; CATS.forEach(c => { const a = ratingOf(id, 'a', c.id), b = ratingOf(id, 'b', c.id); if (a && b) d.push(Math.abs(a - b)); });

      ${shareHTML()}${backupHTML()}${importHTML()}`;
  },
  mount() { meter(); },
  refresh() { const d = $('#us-data'); if (d) d.innerHTML = usData(); },
};
async function meter() {
  const box = $('#meter'); const as = S.cloud.assets; if (!box || !as) return;
  try { const r = await as.list(); const u = r.usage; const pct = Math.min(100, Math.round(u.bytes / u.maxBytes * 100)); box.innerHTML = `<div style="display:flex;justify-content:space-between;font:800 .9rem var(--f-display)"><span>Espacio de fotos</span><span>${(u.bytes / 1048576).toFixed(0)} MB de ${(u.maxBytes / 1048576).toFixed(0)} MB</span></div><div class="prog"><i style="width:${pct}%"></i></div>`; } catch (e) { /* sin medidor */ }
}
function backupData() {
  return { version: 1, exportado: new Date().toISOString(), config: S.cfg, aventuras: advList(), voces: Object.values(S.voices), capitulos: Object.values(S.chapters), deseos: Object.values(S.wishes), retos: Object.values(S.retos) };
}
A.bk = async () => {
  const dl = S.cloud.downloads; if (!dl) { toast('Esta vista no permite descargar archivos.'); return; }
  try { await dl.save({ filename: 'libro-de-aventuras.json', data: JSON.stringify(backupData(), null, 2) }); toast('Copia lista'); } catch (e) { if (!e || e.code !== 'declined') toast('No se pudo descargar la copia.'); }
};
async function photoBlob(id) {
  try { const r = await fetch(blob(id)); if (r.ok) return await r.blob(); } catch (e) { /* intento con canvas */ }
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0); c.toBlob(b => (b ? res(b) : rej(new Error('vacío'))), 'image/jpeg', 0.9); }; im.onerror = rej; im.src = blob(id); });
}
A.bkzip = async el => {
  const dl = S.cloud.downloads; if (!dl) { toast('Esta vista no permite descargar archivos.'); return; }
  if (!window.JSZip) { toast('No se pudo cargar el compresor. Prueba con la copia de textos.'); return; }
  const lbl = el.innerHTML; el.disabled = true;
  try {
    const zip = new JSZip(); zip.file('libro.json', JSON.stringify(backupData(), null, 2));
    const ids = []; advList().forEach(a => (a.photos || []).forEach(p => { if (p.id && !ids.includes(p.id)) ids.push(p.id); }));
    let n = 0; for (const id of ids) { n++; el.textContent = `Fotos ${n} de ${ids.length}…`; try { zip.file('fotos/' + id + '.jpg', await photoBlob(id)); } catch (e) { /* esa foto se omite */ } }
    el.textContent = 'Comprimiendo…'; const out = await zip.generateAsync({ type: 'blob' });
    await dl.save({ filename: 'libro-con-fotos.zip', data: out }); toast('Copia con fotos lista');
  } catch (e) { if (!e || e.code !== 'declined') toast('No se pudo crear la copia. Intenta con la de textos.'); }
  el.disabled = false; el.innerHTML = lbl;
};
